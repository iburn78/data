<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QP</title>
<link rel="stylesheet" href="node/html/index.css">
<script src="node/html/navbar.js" defer></script>
</head>

<body>


<main>
    <section id="qp-market-plot" hidden aria-label="Market sentiment plot">
        <div class="qp-plot-controls">
            <label for="qp-model-select">Model
                <select id="qp-model-select">
                    <option value="Profile" selected>Profile</option>
                    <option value="Component">Component</option>
                    <option value="ValueChain">Value Chain</option>
                </select>
            </label>
            <label for="qp-category-select">Category
                <select id="qp-category-select">
                    <option selected>A</option>
                    <option>B</option>
                    <option>C</option>
                    <option>D</option>
                </select>
            </label>
        </div>
        <div id="qp-market-plot-chart"></div>
    </section>
    <div id="search-help" class="search-help" hidden></div>
    <section id="model-list-plot" hidden>
        <h2 id="model-list-plot-title"></h2>
        <div id="model-list-plot-chart"></div>
    </section>
    <div id="list-actions" class="list-actions" hidden></div>
    <div id="file-list"></div>
    <div id="content"></div>
</main>

<script src="node/html/progress.js" defer></script>
<script src="node/html/index.js" defer></script>
</body>
<footer>
    <div class="footer-title">Quarterly Performances</div>
</footer>
</html>
